# This workflow runs the Playwright browser specs.
#
# They existed for a long time before anything ran them. `npm run test:e2e` and
# `npm run ci` both invoke Playwright, no workflow did, and the suite includes the
# accessibility guard for `src/css/forced-colors.css` — a sheet whose entire purpose is
# a failure mode nobody sees by accident. A spec that never executes is indistinguishable
# from one that passes, which is how `obj-mtl.spec.ts` came to be broken at v3.4.0
# without anyone knowing.
#
# SPDX-FileCopyrightText: 2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: Playwright Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playwright-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - 'vite.config.js'

  test:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    name: Playwright Tests

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `obj-mtl.spec.ts` and `tests/smoke/viewer.spec.ts` serve `js/threedviewer-main.mjs`
      # from the project root, and the smoke spec also wants the copied Draco wasm, which
      # only the prebuild step puts there. Without this they skip themselves, and a run
      # that skipped them reports the same green as one that passed them.
      - name: Build
        run: npm run build

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, test]

    if: always()

    name: playwright-tests

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.test.result != 'success' }}; then exit 1; fi
