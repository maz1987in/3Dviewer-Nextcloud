# Opens models in a browser against a real Nextcloud server, with the app installed the way
# the App Store installs it.
#
# Four bugs reached users because nothing ran the built frontend inside a real Nextcloud:
#   #169  STEP failed on Nextcloud 34: the bundled runtime needed CSP 'unsafe-eval'.
#   #188  STEP/IGES/BREP/FCSTD, IFC and 3DM never opened on App Store installs: the WASM URLs
#         were hard-coded to /apps/threedviewer/, and an App Store install lives in custom_apps/.
#   #204  3DM never finished loading: rhino3dm used `new Function`, which the CSP blocks.
#   #211  The navigation icon 404'd on custom_apps installs.
# The Playwright suite in test-playwright.yml serves the bundle from a static page with a fake
# `OCA`, so it can see none of them, and the PHP integration suite installs the app under
# apps/ and never loads the frontend. This workflow is the one that can.
#
# It is a workflow of its own rather than a job of test-integration.yml: it needs Node, PHP,
# a browser and a built bundle in one job, and it runs a single server version, where that
# one fans out over the supported range.
#
# What is packaged below is what release.yml packages. If one list of exclusions changes, change
# the other: the point is to run what users get.
#
# SPDX-License-Identifier: MIT

name: E2E on Nextcloud

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-nextcloud-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      branch-max: ${{ steps.versions.outputs.branches-max }}
      php-max: ${{ steps.versions.outputs.php-max }}
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Derived from info.xml, as in test-integration.yml, so this tracks the newest server
      # the app claims to support.
      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@58becf3b4bb6dc6cef677b15e2fd8e7d48c0908f # v1.3.1

      - name: Check the derived versions are not empty
        env:
          BRANCH_MAX: ${{ steps.versions.outputs.branches-max }}
          PHP_MAX: ${{ steps.versions.outputs.php-max }}
        run: |
          test -n "$BRANCH_MAX" || { echo "branches-max is empty"; exit 1; }
          test -n "$PHP_MAX" || { echo "php-max is empty"; exit 1; }
          echo "newest supported server: $BRANCH_MAX on php $PHP_MAX"

  e2e:
    runs-on: ubuntu-latest
    needs: matrix
    timeout-minutes: 30

    name: e2e ${{ needs.matrix.outputs.branch-max }}

    env:
      E2E_PORT: 8080
      E2E_USER: e2e-user
      E2E_PASSWORD: e2e-user-Pass-Aa1

    steps:
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nextcloud/server
          ref: ${{ needs.matrix.outputs.branch-max }}
          submodules: true
          persist-credentials: false

      # The Files app opens a model through the Viewer app, which is bundled with a Nextcloud
      # release but is a repository of its own, so a checkout of the server does not have it.
      # Its stable branches carry the built JavaScript.
      - name: Checkout Viewer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nextcloud/viewer
          ref: ${{ needs.matrix.outputs.branch-max }}
          path: apps/viewer
          persist-credentials: false

      # Outside the server tree: this is the source, and what is installed is a copy of it
      # made further down.
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: threedviewer-src
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          path: threedviewer-src
          fallbackNode: '^22'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Set up php${{ needs.matrix.outputs.php-max }}
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: ${{ needs.matrix.outputs.php-max }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: threedviewer-src
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          npm ci
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Build the app
        working-directory: threedviewer-src
        run: npm run build

      # The package a release makes (see release.yml), copied into custom_apps/, which is where
      # the App Store puts an app. Not into apps/: that is the root the app's hard-coded
      # /apps/threedviewer/ URLs would happen to resolve in.
      - name: Install the app into custom_apps
        run: |
          mkdir -p custom_apps/threedviewer
          rsync -a threedviewer-src/ custom_apps/threedviewer/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "tests/" \
            --exclude "test-results/" \
            --exclude "playwright-report/" \
            --exclude "blob-report/" \
            --exclude "docs/" \
            --exclude "docker/" \
            --exclude "scripts/" \
            --exclude "vendor-bin/" \
            --exclude "dist/" \
            --exclude "threedviewer-app/" \
            --exclude "threedviewer-*/" \
            --exclude "*.map"
          # The shipped apps root stays read-only and the writable one is custom_apps/, as in
          # the official Docker image and on any server that installs apps from the store.
          cat > config/apps.config.php <<'PHP'
          <?php
          $CONFIG = [
            'apps_paths' => [
              ['path' => OC::$SERVERROOT . '/apps', 'url' => '/apps', 'writable' => false],
              ['path' => OC::$SERVERROOT . '/custom_apps', 'url' => '/custom_apps', 'writable' => true],
            ],
          ];
          PHP

      - name: Install Nextcloud
        run: |
          mkdir -p data
          php occ maintenance:install \
            --verbose \
            --database=sqlite \
            --database-name=nextcloud \
            --admin-user=admin \
            --admin-pass=e2e-suite-admin-Aa1
          php occ config:system:set appstoreenabled --type=boolean --value=false
          php occ app:enable --force viewer
          php occ app:enable --force threedviewer
          OC_PASS="$E2E_PASSWORD" php occ user:add --password-from-env --display-name="E2E User" "$E2E_USER"
          # The Files page renders thumbnails of the folder's models in the background, in
          # WebGL. On the software renderer a runner has, that stalled the first model the
          # user opened for a minute. What this suite checks is opening a model, so the user
          # has the background thumbnails off, which is a setting the app offers.
          php occ user:setting "$E2E_USER" threedviewer user_preferences '{"thumbnails":{"background":false}}'

      # Proves the app is installed where this job says it is. If it were in apps/, the
      # hard-coded URLs this suite exists to catch would resolve, and the suite would pass
      # while telling nothing.
      - name: Check where the app is installed
        run: |
          path=$(php occ app:getpath threedviewer)
          echo "threedviewer is at $path"
          case "$path" in
            */custom_apps/threedviewer) ;;
            *) echo "expected the app under custom_apps/"; exit 1 ;;
          esac
          test ! -e apps/threedviewer
          test -f custom_apps/threedviewer/js/threedviewer-main.mjs
          php occ app:list | grep -E "viewer|threedviewer"

      # php -S applies no .htaccess, so pages are addressed through index.php (the specs do).
      # Several workers, because a page makes many requests at once and a single-threaded
      # server serves a wasm file only after the script that is waiting for it.
      - name: Start a web server
        run: |
          php occ config:system:set trusted_domains 1 --value="localhost:$E2E_PORT"
          PHP_CLI_SERVER_WORKERS=4 php -S "localhost:$E2E_PORT" > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:$E2E_PORT/status.php" > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/php-server.log
          exit 1

      - name: Install Chromium
        working-directory: threedviewer-src
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: threedviewer-src
        env:
          E2E_BASE_URL: http://localhost:${{ env.E2E_PORT }}
        run: npx playwright test -c tests/e2e-nextcloud/playwright.config.ts

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- php -S ---"
          cat /tmp/php-server.log || true
          echo "--- nextcloud.log ---"
          cat data/nextcloud.log || true

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-nextcloud-report
          path: |
            threedviewer-src/playwright-report/e2e-nextcloud/
            threedviewer-src/test-results/e2e-nextcloud/
            /tmp/php-server.log
            data/nextcloud.log
          retention-days: 7

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [matrix, e2e]

    if: always()

    name: e2e-nextcloud-summary

    steps:
      - name: Summary status
        run: if ${{ needs.e2e.result != 'success' }}; then exit 1; fi
