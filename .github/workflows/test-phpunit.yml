# Runs the PHP unit suite — the only workflow that runs PHP tests.
#
# It used to run none of them: the unit suite was in no workflow at all, while
# test-integration.yml invoked test:integration and test:migration, which passed
# a positional `tests` path that overrode their configured testsuite and so ran
# the same unit suite under two other names. That workflow has been retired; the
# matrix below is what actually covers lib/.
#
# SPDX-License-Identifier: MIT

name: PHPUnit

on:
  pull_request:
  # Most lib/ work on this repo lands as a direct commit, so a pull_request-only
  # trigger means the checks below never see it.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      ocp-matrix: ${{ steps.versions.outputs.ocp-matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Derived from info.xml's min/max-version rather than hardcoded, so the range
      # cannot drift away from what the app claims to support.
      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@58becf3b4bb6dc6cef677b15e2fd8e7d48c0908f # v1.3.1

  unit-tests:
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.ocp-matrix) }}

    name: phpunit ${{ matrix.ocp-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up php${{ matrix.php-min }}
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: ${{ matrix.php-min }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer remove nextcloud/ocp --dev
          composer i

      - name: Install OCP # zizmor: ignore[template-injection]
        run: composer require --dev 'nextcloud/ocp:${{ matrix.ocp-version }}' --ignore-platform-reqs --with-dependencies

      - name: Run unit tests
        run: composer test:unit

  summary:
    runs-on: ubuntu-latest
    needs: [matrix, unit-tests]

    if: always()

    name: phpunit-summary

    steps:
      - name: Summary status
        run: if ${{ needs.unit-tests.result != 'success' }}; then exit 1; fi
