# Runs the PHP integration suite against a real Nextcloud server.
#
# A workflow of this name existed before and was retired in #127, because it did not
# do what it said: it invoked test:integration and test:migration, each of which passed
# a positional `tests` path that overrode the configured testsuite, so both ran the unit
# suite under another name — against no server at all, and green.
#
# This one checks out nextcloud/server, installs it, enables the app inside it, and runs
# a suite whose bootstrap exits non-zero when it cannot find a server. The composer
# script deliberately passes no positional path, so the testsuite in the config is what
# runs.
#
# SPDX-License-Identifier: MIT

name: PHPUnit integration

on:
  pull_request:
  # lib/ work on this repo often lands as a direct commit, so a pull_request-only
  # trigger would leave main uncovered.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phpunit-integration-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      ocp-matrix: ${{ steps.versions.outputs.ocp-matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Derived from info.xml rather than hardcoded, so the range cannot drift from
      # what the app claims to support.
      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@58becf3b4bb6dc6cef677b15e2fd8e7d48c0908f # v1.3.1

  integration-tests:
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.ocp-matrix) }}

    name: integration ${{ matrix.ocp-version }}

    steps:
      # The matrix names OCP releases as `dev-stableNN`; the server branch is the
      # part after the dash.
      - name: Derive the server branch
        id: server
        env:
          OCP_VERSION: ${{ matrix.ocp-version }}
        run: echo "branch=${OCP_VERSION#dev-}" >> "$GITHUB_OUTPUT"

      # The app has to live inside the server tree, so the server is checked out to
      # the workspace root and the app into apps/ beneath it.
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nextcloud/server
          ref: ${{ steps.server.outputs.branch }}
          submodules: true
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: apps/threedviewer
          persist-credentials: false

      - name: Set up php${{ matrix.php-min }}
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: ${{ matrix.php-min }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nextcloud/ocp stays installed on purpose. It declares no composer autoload and
      # appears in none of the generated maps, so it cannot shadow the OCP the running
      # server provides; removing it would only put the lock file out of date and break
      # the install below.
      - name: Install app dependencies
        working-directory: apps/threedviewer
        run: composer install --no-interaction --no-progress

      - name: Install Nextcloud
        run: |
          mkdir -p data
          php occ maintenance:install \
            --verbose \
            --database=sqlite \
            --database-name=nextcloud \
            --admin-user=admin \
            --admin-pass=integration-suite-admin-Aa1
          php occ app:enable --force threedviewer

      # files_external registers a mount provider that queries oc_external_mounts, and a
      # fresh install from source leaves that table uncreated on stable32 and later. Any
      # getUserFolder() then dies inside mount setup, before the code under test runs —
      # which is what failed here on 32, 33 and 34 while 31 passed. Nothing in this app
      # touches external storage.
      - name: Drop the external-storage mount provider
        run: php occ app:disable files_external || echo 'files_external was not enabled'

      # Proves the app is actually installed before the suite claims anything about it.
      - name: Show app state
        run: php occ app:list | grep -A1 -i threedviewer

      - name: Run integration tests
        working-directory: apps/threedviewer
        run: composer test:integration

  summary:
    runs-on: ubuntu-latest
    needs: [matrix, integration-tests]

    if: always()

    name: phpunit-integration-summary

    steps:
      - name: Summary status
        run: if ${{ needs.integration-tests.result != 'success' }}; then exit 1; fi
