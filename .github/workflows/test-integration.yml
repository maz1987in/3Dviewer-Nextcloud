# Runs the PHP integration suite against a real Nextcloud server.
#
# A workflow of this name existed before and was retired in #127, because it did not
# do what it said: it invoked test:integration and test:migration, each of which passed
# a positional `tests` path that overrode the configured testsuite, so both ran the unit
# suite under another name — against no server at all, and green.
#
# This one checks out nextcloud/server, installs it, enables the app inside it, and runs
# a suite whose bootstrap exits non-zero when it cannot find a server. The composer
# script deliberately passes no positional path, so the testsuite in the config is what
# runs.
#
# SPDX-License-Identifier: MIT

name: PHPUnit integration

on:
  pull_request:
  # lib/ work on this repo often lands as a direct commit, so a pull_request-only
  # trigger would leave main uncovered.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phpunit-integration-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      ocp-matrix: ${{ steps.versions.outputs.ocp-matrix }}
      branch-max: ${{ steps.versions.outputs.branches-max }}
      php-max: ${{ steps.versions.outputs.php-max }}
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Derived from info.xml rather than hardcoded, so the range cannot drift from
      # what the app claims to support.
      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@58becf3b4bb6dc6cef677b15e2fd8e7d48c0908f # v1.3.1

      # An output that is renamed upstream, or misspelled here, arrives as an empty
      # string — and a job that checks out an empty ref fails somewhere further down
      # with a message about something else entirely. Say it here instead.
      - name: Check the derived versions are not empty
        env:
          BRANCH_MAX: ${{ steps.versions.outputs.branches-max }}
          PHP_MAX: ${{ steps.versions.outputs.php-max }}
        run: |
          test -n "$BRANCH_MAX" || { echo "branches-max is empty"; exit 1; }
          test -n "$PHP_MAX" || { echo "php-max is empty"; exit 1; }
          echo "newest supported server: $BRANCH_MAX on php $PHP_MAX"

  integration-tests:
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.ocp-matrix) }}

    name: integration ${{ matrix.ocp-version }}

    steps:
      # The matrix names OCP releases as `dev-stableNN`; the server branch is the
      # part after the dash.
      - name: Derive the server branch
        id: server
        env:
          OCP_VERSION: ${{ matrix.ocp-version }}
        run: echo "branch=${OCP_VERSION#dev-}" >> "$GITHUB_OUTPUT"

      # The app has to live inside the server tree, so the server is checked out to
      # the workspace root and the app into apps/ beneath it.
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nextcloud/server
          ref: ${{ steps.server.outputs.branch }}
          submodules: true
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: apps/threedviewer
          persist-credentials: false

      - name: Set up php${{ matrix.php-min }}
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: ${{ matrix.php-min }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nextcloud/ocp stays installed on purpose. It declares no composer autoload and
      # appears in none of the generated maps, so it cannot shadow the OCP the running
      # server provides; removing it would only put the lock file out of date and break
      # the install below.
      - name: Install app dependencies
        working-directory: apps/threedviewer
        run: composer install --no-interaction --no-progress

      - name: Install Nextcloud
        run: |
          mkdir -p data
          php occ maintenance:install \
            --verbose \
            --database=sqlite \
            --database-name=nextcloud \
            --admin-user=admin \
            --admin-pass=integration-suite-admin-Aa1
          php occ app:enable --force threedviewer

      # files_external registers a mount provider that queries oc_external_mounts, and
      # on stable32 and later a fresh install leaves that table uncreated: every
      # getUserFolder() then dies inside mount setup, before any code under test runs.
      #
      # Disabling it does not help — occ reports it as not enabled while the server's
      # test bootstrap loads it anyway, so the provider runs against a schema that was
      # never installed. Enabling it is what actually creates the table.
      - name: Install the external-storage schema
        run: php occ app:enable files_external

      # Proves the app is actually installed before the suite claims anything about it.
      - name: Show app state
        run: php occ app:list | grep -A1 -i threedviewer

      - name: Run integration tests
        working-directory: apps/threedviewer
        run: composer test:integration

  # The same suite against MySQL and Postgres.
  #
  # The job above covers the *version* axis on SQLite; this one covers the *database*
  # axis, because that is where the queries behave differently rather than where the
  # server does. Two examples the suite already touches: `escapeLikeParameter()` picks
  # an escape character per platform, and MySQL's default collation is case-insensitive
  # while SQLite's and Postgres's are not — so a folder listing that looks settled on
  # one backend is not settled on the others.
  #
  # Newest supported server only. Crossing both axes would be eight more jobs on every
  # pull request to re-answer a question neither axis asks of the other.
  database-tests:
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]

    name: integration ${{ matrix.database }}

    # Both containers start for both jobs: a service cannot be declared conditionally,
    # and one idle database is cheaper than two near-identical copies of this job.
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: integration-suite-db
          MYSQL_DATABASE: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: integration-suite-db
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nextcloud/server
          ref: ${{ needs.matrix.outputs.branch-max }}
          submodules: true
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: apps/threedviewer
          persist-credentials: false

      - name: Set up php${{ needs.matrix.outputs.php-max }}
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2.33.0
        with:
          php-version: ${{ needs.matrix.outputs.php-max }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite, mysql, pdo_mysql, pgsql, pdo_pgsql
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install app dependencies
        working-directory: apps/threedviewer
        run: composer install --no-interaction --no-progress

      - name: Install Nextcloud on ${{ matrix.database }}
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          mkdir -p data
          if [ "$DATABASE" = "mysql" ]; then
            port=3306
            user=root
          else
            port=5432
            user=postgres
          fi
          php occ maintenance:install \
            --verbose \
            --database="$DATABASE" \
            --database-name=nextcloud \
            --database-host=127.0.0.1 \
            --database-port="$port" \
            --database-user="$user" \
            --database-pass=integration-suite-db \
            --admin-user=admin \
            --admin-pass=integration-suite-admin-Aa1
          php occ app:enable --force threedviewer

      # See the note on the SQLite job: enabling files_external is what creates the
      # table its mount provider queries.
      - name: Install the external-storage schema
        run: php occ app:enable files_external

      # Proves the suite ran against the database this job is named for, rather than
      # falling back to SQLite because an install flag was ignored.
      - name: Show the database in use
        run: php occ config:system:get dbtype

      - name: Run integration tests
        working-directory: apps/threedviewer
        run: composer test:integration

  summary:
    runs-on: ubuntu-latest
    needs: [matrix, integration-tests, database-tests]

    if: always()

    name: phpunit-integration-summary

    steps:
      - name: Summary status
        run: |
          if ${{ needs.integration-tests.result != 'success' }}; then exit 1; fi
          if ${{ needs.database-tests.result != 'success' }}; then exit 1; fi
